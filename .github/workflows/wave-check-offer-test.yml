name: Wave Check Offer Test

on:
  pull_request:
    paths:
      - 'src/pages/wave-audit/WaveAudit.test.tsx'
      - 'src/pages/wave-audit/FullWaveReport.tsx'
      - '.github/workflows/wave-check-offer-test.yml'

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx vitest run src/pages/wave-audit/WaveAudit.test.tsx
