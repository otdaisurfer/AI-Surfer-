name: Deploy Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: ls -la dist

      - name: Deploy to Production (Main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Production deployment ready"
          echo "Connect Vercel, Netlify, Cloudflare Pages, or GitHub Pages here"
