openapi: 3.1.0
info:
  title: Ocean Tide Drop AI SURFER API
  version: 1.0.0
  description: |
    Developer API for AI Fin, AI Wave / AEO audit intake, lead routing,
    follow-up, onboarding, and Launch Desk.
    
    Production deployments should protect write endpoints with authentication
    or an equivalent access layer, restrict CORS, and add abuse protection.
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: System
  - name: AI Fin
  - name: Launch Desk

paths:
  /health:
    get:
      tags: [System]
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: API health and configuration state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/ai-fin/leads:
    post:
      tags: [AI Fin]
      summary: Save an AI Fin lead
      operationId: createAiFinLead
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFinLeadRequest"
      responses:
        "201":
          description: Lead saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFinLeadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai-fin/audit/start:
    post:
      tags: [AI Fin]
      summary: Start an AI Wave / AEO audit
      operationId: startAiFinAudit
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFinAuditStartRequest"
      responses:
        "201":
          description: Audit queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFinAuditStartResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai-fin/handoff:
    post:
      tags: [AI Fin]
      summary: Queue a human handoff
      operationId: createAiFinHandoff
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFinHandoffRequest"
      responses:
        "201":
          description: Handoff queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFinHandoffResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai-fin/follow-up:
    post:
      tags: [AI Fin]
      summary: Queue an AI Fin follow-up
      operationId: createAiFinFollowUp
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFinFollowUpRequest"
      responses:
        "201":
          description: Follow-up queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFinFollowUpResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/ai-fin/onboarding:
    post:
      tags: [AI Fin]
      summary: Start onboarding
      operationId: createAiFinOnboarding
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFinOnboardingRequest"
      responses:
        "201":
          description: Onboarding step created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFinOnboardingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/launch:
    post:
      tags: [Launch Desk]
      summary: Stream a Launch Desk plan
      operationId: createLaunchPlan
      security:
        - ApiKeyAuth: []
      description: |
        Returns Server-Sent Events (SSE). Event types include tool_progress,
        text_delta, final, and error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchBrief"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-AI-Surfer-Key
      description: Server-side AI SURFER API key. Never expose this value in browser code.

  responses:
    ValidationError:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Server configuration or persistence failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, service, openaiConfigured, supabaseConfigured]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: launch-desk-api
        openaiConfigured:
          type: boolean
        supabaseConfigured:
          type: boolean

    ErrorIssue:
      type: object
      properties:
        path:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [ok, error, message]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ErrorIssue"

    AiFinLeadRequest:
      type: object
      required:
        - contactName
        - businessName
        - email
        - primaryProblem
        - recommendedProduct
        - leadStage
        - urgency
        - conversationSummary
        - consentToFollowUp
      properties:
        contactName:
          type: string
          minLength: 1
          maxLength: 120
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 50
        website:
          type: [string, "null"]
          maxLength: 500
        industry:
          type: [string, "null"]
          maxLength: 120
        primaryProblem:
          type: string
          minLength: 1
          maxLength: 2000
        secondaryProblem:
          type: [string, "null"]
          maxLength: 2000
        currentProcess:
          type: [string, "null"]
          maxLength: 4000
        desiredOutcome:
          type: [string, "null"]
          maxLength: 2000
        recommendedProduct:
          type: string
          enum:
            - AEO Wave Audit
            - Wave Scout
            - Sales Rider
            - Content Creator
            - Customer Care Cove
            - Automation Architect
            - Big Kahuna
        recommendedPackage:
          type: [string, "null"]
          enum:
            - Wave Starter
            - Wave Builder
            - Tsunami Growth
            - Needs Human Review
            - null
        leadStage:
          type: string
          enum: [COLD, WARM, HOT, "SURF'S UP"]
        urgency:
          type: string
          enum: [Low, Normal, High, Immediate]
        systemsUsed:
          type: array
          maxItems: 30
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 120
        conversationSummary:
          type: string
          minLength: 1
          maxLength: 8000
        source:
          type: string
          minLength: 1
          maxLength: 120
          default: ai-fin
        consentToFollowUp:
          type: boolean
          const: true

    AiFinLeadResponse:
      type: object
      required: [ok, status, leadId, nextAction]
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: saved
        leadId:
          type: string
          format: uuid
        nextAction:
          type: string
          enum: [begin_onboarding, human_review, follow_up]

    AiFinAuditStartRequest:
      type: object
      required: [businessName]
      anyOf:
        - required: [website]
        - required: [businessIdentifier]
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        website:
          type: [string, "null"]
          maxLength: 500
        businessIdentifier:
          type: [string, "null"]
          maxLength: 500
        contactName:
          type: [string, "null"]
          maxLength: 120
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        source:
          type: string
          enum: [homepage_chat, aeo_page, pricing_page, product_page, other, ai-fin]
          default: ai-fin

    AiFinAuditStartResponse:
      type: object
      required: [ok, status, auditId, nextStep]
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: started
        auditId:
          type: string
          format: uuid
        nextStep:
          type: string
          const: complete_aeo_audit

    AiFinHandoffRequest:
      type: object
      required:
        - contactName
        - businessName
        - email
        - reason
        - conversationSummary
        - urgency
        - consentToFollowUp
      properties:
        leadId:
          type: [string, "null"]
          format: uuid
        contactName:
          type: string
          minLength: 1
          maxLength: 120
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 50
        website:
          type: [string, "null"]
          maxLength: 500
        reason:
          type: string
          enum:
            - custom_pricing
            - complex_scope
            - enterprise
            - regulated_industry
            - legal_or_contract_question
            - uncertain_scope
            - visitor_requested_person
            - other
        recommendedProduct:
          type: [string, "null"]
          maxLength: 160
        conversationSummary:
          type: string
          minLength: 1
          maxLength: 8000
        urgency:
          type: string
          enum: [Normal, High, Immediate]
        consentToFollowUp:
          type: boolean
          const: true

    AiFinHandoffResponse:
      type: object
      required: [ok, status, reviewId, priority]
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: queued
        reviewId:
          type: string
          format: uuid
        priority:
          type: string
          enum: [Normal, High, Immediate]

    AiFinFollowUpRequest:
      type: object
      required:
        - contactName
        - email
        - recommendedProduct
        - conversationSummary
        - messageType
        - consentToFollowUp
      properties:
        leadId:
          type: [string, "null"]
          format: uuid
        contactName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        recommendedProduct:
          type: string
          minLength: 1
          maxLength: 160
        recommendedPackage:
          type: [string, "null"]
          maxLength: 160
        conversationSummary:
          type: string
          minLength: 1
          maxLength: 8000
        messageType:
          type: string
          enum: [recommendation_summary, next_steps, human_review_confirmation]
        consentToFollowUp:
          type: boolean
          const: true

    AiFinFollowUpResponse:
      type: object
      required: [ok, status, messageId]
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: queued
        messageId:
          type: string
          format: uuid

    AiFinOnboardingRequest:
      type: object
      required:
        - contactName
        - businessName
        - email
        - recommendedProduct
        - recommendedPackage
        - nextStepType
      properties:
        leadId:
          type: [string, "null"]
          format: uuid
        contactName:
          type: string
          minLength: 1
          maxLength: 120
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        recommendedProduct:
          type: string
          minLength: 1
          maxLength: 120
        recommendedPackage:
          type: string
          enum: [Wave Starter, Wave Builder, Tsunami Growth]
        nextStepType:
          type: string
          enum: [checkout, booking, intake_form, human_review]

    AiFinOnboardingResponse:
      type: object
      required:
        - ok
        - status
        - onboardingId
        - nextStepType
        - checkoutStatus
        - requiresConfiguration
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          enum: [ready, waiting_configuration]
        onboardingId:
          type: string
          format: uuid
        nextStepType:
          type: string
          enum: [checkout, booking, intake_form, human_review]
        checkoutStatus:
          type: string
          enum: [ready, configuration_required, not_requested]
        url:
          type: ["null"]
        requiresConfiguration:
          type: boolean
        checkoutConfiguration:
          type: [object, "null"]
          properties:
            stripeSecretConfigured:
              type: boolean
            packagePriceConfigured:
              type: boolean
            requiredPriceEnvironmentVariable:
              type: string

    LaunchBrief:
      type: object
      required: [productBrief, audience, launchDate, channels]
      properties:
        productBrief:
          type: string
          minLength: 20
        audience:
          type: string
          minLength: 3
        launchDate:
          type: string
          minLength: 4
        constraints:
          type: string
          default: None specified
        assets:
          type: string
          default: None specified
        channels:
          type: array
          minItems: 1
          items:
            type: string
